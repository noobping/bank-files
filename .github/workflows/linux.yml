name: Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      BIN_NAME: bank-files
      ASSET_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gettext \
            libadwaita-1-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --package bank-files --locked --release --features setup

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA:0:7}"
          fi
          out="${BIN_NAME}-${version}.${ASSET_ARCH}"
          install -m755 "target/${CARGO_BUILD_TARGET}/release/${BIN_NAME}" "$out"
          echo "FILE=$out" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-files-linux-${{ matrix.arch }}
          path: ${{ env.FILE }}
          if-no-files-found: error

      - name: Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.FILE }}
          fail_on_unmatched_files: true
